# ====================================================================
# Base Sysctl Hardening
# Optimized for low-latency workstations
# ====================================================================

# Hide kernel symbol addresses from unprivileged users
# Prevents attackers from locating kernel code in memory while preserving KASLR
kernel.kptr_restrict = 2

# Enable JIT hardening for the Berkeley Packet Filter (eBPF)
# Constant-blinds BPF JIT instruction emission to mitigate JIT-spray exploits
net.core.bpf_jit_harden = 2

# Restrict performance event monitoring (perf) access for unprivileged users
# Disallows unprivileged use of perf/events without CAP_PERFMON or CAP_SYS_ADMIN
kernel.perf_event_paranoid = 3

# Maximize Address Space Layout Randomization (ASLR) entropy for 64-bit processes
# Increases memory layout randomness to make buffer overflow exploitation substantially harder
vm.mmap_rnd_bits = 32

# Restrict process tracing (ptrace) via Yama LSM
# Value 1 allows a process to trace only its own direct child processes
kernel.yama.ptrace_scope = 1
