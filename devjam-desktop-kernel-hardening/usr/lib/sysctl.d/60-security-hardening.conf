# ====================================================================
# Additional Kernel & Filesystem Hardening
# Zero performance/latency impact
# ====================================================================

# Limit maximum kernel oops and warning count before panicking
# Prevents brute-force exploitation loops targeting kernel memory layouts
kernel.oops_limit = 100
kernel.warn_limit = 100

# Prevent automatic loading of vulnerable or legacy TTY line disciplines
dev.tty.ldisc_autoload = 0

# Restrict FIFO creation in world-writable sticky directories (e.g., /tmp)
# Protects against spoofing and unauthorized data interception
fs.protected_fifos = 2

# Disable core dumps for setuid binaries to avoid leaking sensitive data to disk
fs.suid_dumpable = 0
