# Groups for the live user (live-config, component user-setup).
# One list with every group the lab images may need. user-setup adds the user
# to each group separately and skips groups that do not exist in the image, so
# a group of a module that is not built in does no harm.
# Only one file may set this variable: a later file replaces the list.
LIVE_USER_DEFAULT_GROUPS="audio bluetooth cdrom dialout dip floppy lp lpadmin netdev pipewire plugdev saned scanner systemd-journal sudo users video monitoring psychopy psychtoolbox"
