# Use the amdgpu DDX instead of the built-in modesetting driver on GPUs
# that use the amdgpu kernel driver. Alternative to
# devjam-gpu-x11-xlibre-modesetting; do not install both.
# TearFree defaults to "auto" in amdgpu (only rotated/transformed and
# secondary outputs), so it is enabled explicitly here.
Section "OutputClass"
    Identifier  "devjam amdgpu"
    MatchDriver "amdgpu"
    Driver      "amdgpu"
    Option      "TearFree" "true"
EndSection
