# Use the amdgpu DDX instead of the built-in modesetting driver on GPUs
# that use the amdgpu kernel driver. Alternative to
# devjam-gpu-x11-xlibre-modesetting; do not install both.
# TearFree in the amdgpu DDX defaults to "auto": only on for rotated or
# transformed outputs, secondary GPUs, ShadowPrimary or VRR, so off on a
# plain single-monitor setup. Enable it for all outputs here.
Section "OutputClass"
    Identifier  "devjam amdgpu"
    MatchDriver "amdgpu"
    Driver      "amdgpu"
    Option      "TearFree" "true"
EndSection
