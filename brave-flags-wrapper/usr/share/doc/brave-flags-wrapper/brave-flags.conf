# Default command-line flags for Brave and Brave Origin (system-wide).
# To customise, copy this file to ~/.config/brave-flags.conf and edit it.
# If that file exists, THIS file is ignored (an empty home file = no flags).
# One flag per line, e.g.:
#   --ozone-platform-hint=auto
# Multiple --enable-features= / --disable-features= lines are merged.
