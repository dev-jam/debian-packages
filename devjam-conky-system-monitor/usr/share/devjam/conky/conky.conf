    header = math.floor(15 * scale),
    mono   = math.floor(11 * scale),
    bar_h  = math.floor(14 * scale),
    width  = math.floor(500 * scale),
}

local template = [[
${color2}${font DejaVu Sans:bold:size={{title}}}SYSTEM MONITOR${font}${hr 2}${color}

${color1}${font DejaVu Sans:bold:size={{header}}}DISPLAY${font}${color}
${color1}Resolution:${color} ${alignr}${color5}${lua get_display_info}${color}
${color1}Scale:${color} ${alignr}${color5}${lua get_scale_factor}${color}

${color1}${font DejaVu Sans:bold:size={{header}}}CPU OVERVIEW${font}${color}
${color1}Model:${color} ${alignr}${color5}${lua get_cpu_name}${color}
${color1}Cores:${color} ${alignr}${color5}${lua get_cpu_cores}${color}
${color1}Usage:${color} ${alignr}${color5}${cpu cpu0}%${color}
${color2}${cpubar cpu0 {{bar_h}},{{width}}}${color}

${color1}CPU Temp:${color} ${alignr}${color5}${lua get_cpu_temp}${color}
${color1}Power Draw:${color} ${alignr}${color5}${lua get_cpu_power}${color}

${color1}${font DejaVu Sans:bold:size={{header}}}CPU CLOCKS & GOVERNOR${font}${color}
${color1}Current Freq (Max):${color} ${alignr}${color5}${lua get_cpu_freq_max}${color}

${color1}Driver:${color} ${alignr}${color5}${lua get_cpu_driver}${color}
${color1}Governor:${color} ${alignr}${color5}${lua get_cpu_governor}${color}
${color1}EPP / Pref:${color} ${alignr}${color5}${lua get_cpu_epp}${color}

${color1}${font DejaVu Sans:bold:size={{header}}}MEMORY${font}${color}
${color1}RAM Usage:${color} ${alignr}${color5}$mem / $memmax (${memperc}%)${color}
${color2}${membar {{bar_h}},{{width}}}${color}

${color1}${font DejaVu Sans:bold:size={{header}}}NETWORK${font}${color}
{{net_slots}}
${color1}${font DejaVu Sans:bold:size={{header}}}PROCESSES${font}${color}
${color1}${font DejaVu Sans Mono:bold:size={{mono}}}TOP CPU               ${alignr}TOP MEMORY${font}${color}
${color5}${font DejaVu Sans Mono:size={{mono}}}${top name 1} ${top cpu 1}% ${alignr}${top_mem name 1} ${lua top_mem_value 1}${font}${color}
${color5}${font DejaVu Sans Mono:size={{mono}}}${top name 2} ${top cpu 2}% ${alignr}${top_mem name 2} ${lua top_mem_value 2}${font}${color}
${color5}${font DejaVu Sans Mono:size={{mono}}}${top name 3} ${top cpu 3}% ${alignr}${top_mem name 3} ${lua top_mem_value 3}${font}${color}
${color5}${font DejaVu Sans Mono:size={{mono}}}${top name 4} ${top cpu 4}% ${alignr}${top_mem name 4} ${lua top_mem_value 4}${font}${color}
${color5}${font DejaVu Sans Mono:size={{mono}}}${top name 5} ${top cpu 5}% ${alignr}${top_mem name 5} ${lua top_mem_value 5}${font}${color}

${color1}Processes:${color} ${color5}$processes${color} ${color1}total${color} ${color2}|${color} ${color5}$running_processes${color} ${color1}running${color}

${color1}Load Average:${color} ${alignr}${color1}1 min:${color} ${color5}${loadavg 1}${color} ${color2}|${color} ${color1}5 min:${color} ${color5}${loadavg 2}${color} ${color2}|${color} ${color1}15 min:${color} ${color5}${loadavg 3}${color}]]

-- One block per network "slot" (lowest route metric first, see toolbox.lua).
-- A slot is hidden while toolbox.lua reports no interface for it; later slots
-- start with a blank line, so active interfaces are separated by one empty line.
local NET_SLOTS = 4
local net_slot_template = [[
${if_match "${lua net_label {{slot}}}" != ""}{{separator}}${color1}Interface:${color} ${alignr}${color5}${lua net_label {{slot}}}${color}
${color1}Download:${color} ${alignr}${color5}${lua net_down {{slot}}}${color}
${color2}${lua_bar {{bar_h}},{{width}} down_percent {{slot}}}${color}
${color1}Upload:${color} ${alignr}${color5}${lua net_up {{slot}}}${color}
${color2}${lua_bar {{bar_h}},{{width}} up_percent {{slot}}}${color}
${endif}]]

local function fill(text, values)
    -- Replace {{name}} from `values` (an unknown name fails loudly)
    return (text:gsub("{{([%w_]+)}}", function(key)
        return tostring(assert(values[key], "unknown placeholder: " .. key))
    end))
end

local net_blocks = {}
for slot = 1, NET_SLOTS do
    net_blocks[#net_blocks + 1] = fill(net_slot_template, {
        slot = slot,
        separator = (slot > 1) and "\n" or "",
        bar_h = sizes.bar_h,
        width = sizes.width,
    })
end
sizes.net_slots = table.concat(net_blocks)

conky.text = fill(template, sizes)
