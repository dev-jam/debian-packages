    lua_load = '~/.config/conky/toolbox.lua',
    lua_startup_hook = 'start_watcher',

    double_buffer = true,

    alignment = 'bottom_right',
    gap_x = math.floor(0 * scale),
    gap_y = math.floor(0 * scale),
    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky',
    -- With own_window_transparent = true the colour/alpha settings below may be
    -- ignored; set it to false to get the 230/255 tinted background back.
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 230,
    own_window_colour = '0f0a0a',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    draw_borders = true,
    draw_outline = false,
    draw_shades = false,
    border_width = 1,
    border_inner_margin = math.floor(24 * scale),

    update_interval = 1.0,
    use_xft = true,
    font = 'DejaVu Sans:size=' .. math.floor(14 * scale),
    xftalpha = 1.0,

    override_utf8_locale = true,

    default_color = '4d0000',
    color1 = 'ff3333',
    color2 = 'b30000',
    color5 = 'f0e6e6',

    top_name_width = 12,
    top_cpu_separate = false,

    minimum_width = math.floor(500 * scale),
    maximum_width = math.floor(500 * scale),
