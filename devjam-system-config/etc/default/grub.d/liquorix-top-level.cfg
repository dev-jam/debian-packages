# Make the newest installed Liquorix kernel the top-level GRUB entry
# (devjam-system-config), even when another kernel flavour, for example
# the fastforward.debian.net kernel, has a higher version number. The
# other kernels stay available under "Advanced options".
#
# grub-mkconfig sources this file after /etc/default/grub, so the newest
# Liquorix kernel is looked up again on every update-grub run, including
# the run after a kernel install or removal. Without a Liquorix kernel
# GRUB_TOP_LEVEL stays unset and GRUB keeps its normal order.
#
# Needs GRUB >= 2.12 (GRUB_TOP_LEVEL). With GRUB_DEFAULT=0 the top-level
# entry is the default. With GRUB_DEFAULT=saved and GRUB_SAVEDEFAULT=true
# booting the top-level entry saves its fixed id (gnulinux-simple-<uuid>),
# so the default follows the newest Liquorix kernel as well.
#
# Run update-grub after a change.

_liquorix_kernel=$(ls -1 /boot/vmlinuz-*liquorix* 2>/dev/null | sort -V | tail -n 1)

if [ -n "${_liquorix_kernel}" ]; then
	GRUB_TOP_LEVEL="${_liquorix_kernel}"
fi

unset _liquorix_kernel
