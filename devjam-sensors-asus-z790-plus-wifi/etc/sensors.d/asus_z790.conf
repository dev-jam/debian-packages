# ASUS Z790 Motherboard Sensor Configuration
# Location: /etc/sensors.d/asus_z790.conf

chip "nct6798-isa-0290"
    # Voltages with correct scale factors and tolerance limits
    label in0 "Vcore"

    label in1 "+5V"
    compute in1 @ * 5, @ / 5
    set in1_min 5.00 * 0.90
    set in1_max 5.00 * 1.10

    label in2 "AVSB"
    set in2_min 3.30 * 0.90
    set in2_max 3.30 * 1.10

    label in3 "3VCC"
    set in3_min 3.30 * 0.90
    set in3_max 3.30 * 1.10

    label in4 "+12V"
    compute in4 @ * 12, @ / 12
    set in4_min 12.00 * 0.90
    set in4_max 12.00 * 1.10

    label in14 "CPU VCCSA"
    set in14_min 0.40
    set in14_max 1.45

    # Hide unused voltage inputs
    ignore in5
    ignore in6
    ignore in7
    ignore in8
    ignore in9
    ignore in10
    ignore in11
    ignore in12
    ignore in13

    # Fans (All CPU, Chassis, & Pump headers)
    label fan1 "Chassis Fan 1 Speed"
    label fan2 "CPU Fan Speed"
    label fan3 "CPU Optional Fan Speed"
    label fan4 "Chassis Fan 2 Speed"
    label fan5 "Chassis Fan 3 Speed"
    label fan6 "AIO Pump Speed"
    label fan7 "Chassis Fan 4 Speed"

    # Temperatures (Valid physical sensors)
    label temp1 "Motherboard Temp"
    label temp2 "CPU Temp"

    # Ignore virtual/extra temperature sensors (including PCH_CHIP and PCH_CPU)
    ignore temp3
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7
    ignore temp8
    ignore temp9
    ignore temp10
    ignore temp11
    ignore temp12
    ignore temp13
    ignore temp14
    ignore temp15
    ignore temp16

    # Hide unused noise features
    ignore pwm1
    ignore pwm2
    ignore pwm4
    ignore pwm5
    ignore pwm6
    ignore pwm7
    ignore intrusion0
    ignore intrusion1
    ignore beep_enable

# Clean up NVMe limits and hide secondary sub-sensors
chip "nvme-pci-*"
    label temp1 "NVMe Temperature"
    set temp1_min 0
    set temp1_max 75
    ignore temp2
    ignore temp3

# CPU Core Temperature Mapping (Raptor/Alder Lake Architecture)
chip "coretemp-isa-0000"

    label temp1 "CPU Package"

    # Performance Cores (Mapped to hardware core IDs)
    label temp2  "P-Core 0"
    label temp6  "P-Core 1"
    label temp10 "P-Core 2"
    label temp14 "P-Core 3"
    label temp18 "P-Core 4"
    label temp22 "P-Core 5"
    label temp26 "P-Core 6"
    label temp30 "P-Core 7"

    # Efficient Cores (Sequential sysfs index starting at temp34)
    label temp34 "E-Core 0"
    label temp35 "E-Core 1"
    label temp36 "E-Core 2"
    label temp37 "E-Core 3"
    label temp38 "E-Core 4"
    label temp39 "E-Core 5"
    label temp40 "E-Core 6"
    label temp41 "E-Core 7"
    label temp42 "E-Core 8"
    label temp43 "E-Core 9"
    label temp44 "E-Core 10"
    label temp45 "E-Core 11"
