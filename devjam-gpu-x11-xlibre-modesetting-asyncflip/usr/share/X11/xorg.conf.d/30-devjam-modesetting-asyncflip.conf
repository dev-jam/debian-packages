# Async flips on secondary outputs in the modesetting driver (default: off).
# Secondary outputs do not wait for vblank and may tear; mainly useful when
# displays mirror or clone each other.
Section "OutputClass"
    Identifier  "devjam modesetting asyncflip"
    MatchDriver "i915|xe|amdgpu"
    Option      "AsyncFlipSecondaries" "true"
EndSection
