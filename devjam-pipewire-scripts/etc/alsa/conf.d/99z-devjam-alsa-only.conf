# devjam-pipewire-scripts: route ALSA "default" to the sound card instead of PipeWire,
# but only while one of these files exists:
#   $XDG_RUNTIME_DIR/devjam-alsa-only.conf          (switch2alsa, gone after logout/reboot)
#   ~/.config/devjam-pipewire-scripts/alsa-only.conf (switch2alsa-persistent)
@hooks [
	{
		func load
		files [
			{
				@func concat
				strings [
					{ @func getenv vars [ XDG_RUNTIME_DIR ] default "/nonexistent" }
					"/devjam-alsa-only.conf"
				]
			}
			"~/.config/devjam-pipewire-scripts/alsa-only.conf"
		]
		errors false
	}
]
