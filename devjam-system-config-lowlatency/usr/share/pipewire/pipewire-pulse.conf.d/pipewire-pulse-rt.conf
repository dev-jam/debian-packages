# RT-tuned PipeWire: consistent with system limits
context.modules = [
    { name = libpipewire-module-rt
      args = {
        rt.prio = 85
        rt.time.soft = -1
        rt.time.hard = -1
      }
      flags = [ ifexists nofail ]
    }
]

# NOTE: Ensure PAM and systemd LimitRTPRIO >= rt.prio.
# RTKit caps priority to 20 unless disabled.
