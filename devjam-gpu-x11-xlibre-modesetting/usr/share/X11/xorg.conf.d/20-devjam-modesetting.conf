# Use the built-in modesetting driver instead of the legacy intel or amdgpu
# DDX. Without this, XLibre may pick an installed DDX (e.g. the intel driver
# on chips it does not know). TearFree is on by default in XLibre.
Section "OutputClass"
    Identifier  "devjam modesetting"
    MatchDriver "i915|xe|amdgpu"
    Driver      "modesetting"
EndSection
