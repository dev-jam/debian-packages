# Settings for /etc/grub.d/59_boot-personal-isos (devjam-grub-tools).
# Run update-grub after a change.

# UUID of the filesystem containing /boot-isos (see "lsblk -f").
# Leave it empty to leave out the "Find and boot ISO's (personal)" menu.
# Example: GRUB_BOOTISOS_UUID=0a1b2c3d-4e5f-6789-abcd-ef0123456789
GRUB_BOOTISOS_UUID=""
