# Variable refresh rate in the modesetting driver (default: off).
# Only used by fullscreen applications flipping via Present on a
# VRR-capable display. Not for experiments that need a fixed refresh rate.
Section "OutputClass"
    Identifier  "devjam modesetting vrr"
    MatchDriver "i915|xe|amdgpu"
    Option      "VariableRefresh" "true"
EndSection
